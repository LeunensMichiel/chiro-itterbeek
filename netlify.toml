[build]
  command = "npm run build"
  # Static export (next.config.ts: output "export")
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

# Security headers.
# Referrer-Policy is relaxed from "same-origin" (which strips the Referer on
# cross-origin requests and breaks YouTube embeds with "Error 153") to the
# browser default, which only ever sends the origin cross-origin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next.js puts a content hash in every file name under /_next/static/
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Gatsby site's sitemap lived at /sitemap-index.xml
[[redirects]]
  from = "/sitemap-index.xml"
  to = "/sitemap.xml"
  status = 301
